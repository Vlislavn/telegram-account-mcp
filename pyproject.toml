[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "telegram-account-mcp"
version = "0.1.0"
description = "Minimal local Telegram user-account MCP for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.13,<2",
    "telethon>=1.34,<2",
    "python-dotenv>=1,<2",
    "qrcode>=7.4,<9",
    "filelock>=3.16,<4",
]

[project.scripts]
telegram-account-mcp = "telegram_account_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_account_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
